spring.application.name=fintrack

# Nạp file cấu hình chứa các thông tin bí mật
spring.config.import=optional:application-secret.properties

#Server
server.port=8080

#Database (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/fintrack?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#Cors (cho React Vite)
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*

#Encoding (Tránh lỗi Tiếng Việt)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

#FACEBOOK OAUTH2
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}

spring.security.oauth2.client.registration.facebook.scope=email,public_profile

spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v19.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v19.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# Redirect URI sau khi đăng nhập OAuth2 thành công (frontend URL)
app.oauth2.authorizedRedirectUri=http://localhost:5173/oauth2/redirect

# JWT SECRET
app.jwt.secret-key=${JWT_SECRET_KEY}
app.jwt.expiration=86400000

# CLOUD
cloudinary.cloud-name=do1rmzt7f
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}